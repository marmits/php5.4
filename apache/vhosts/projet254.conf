<VirtualHost *:80>
    ServerName projet254
    DocumentRoot /var/www/projet2

    <Directory /var/www/projet2>
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPassMatch "^/(.*\.php(/.*)?)$" "fcgi://php54-fpm:9000/var/www/projet2/"
    DirectoryIndex index.php index.html

    ErrorLog /usr/local/apache2/logs/projet2_error.log
    CustomLog /usr/local/apache2/logs/projet2_access.log combined
</VirtualHost>
