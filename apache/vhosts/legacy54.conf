<VirtualHost *:80>
    ServerName legacy54
    DocumentRoot /var/www/default/htdocs

    <Directory /var/www/default/htdocs>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
    </Directory>

    # Pas d'exécution de .phps
    <FilesMatch "\.phps$">
        Require all denied
    </FilesMatch>

    <FilesMatch "^\.ph(p[3457]?|t|tml)$">
        Require all granted
    </FilesMatch>

    # Clé : mappe *.php vers PHP-FPM dans l'autre conteneur
    ProxyPassMatch "^/(.*\.php(/.*)?)$" "fcgi://php54-fpm:9000/var/www/default/htdocs/"

    ProxyTimeout 300
    DirectoryIndex index.php index.html

    ErrorLog /usr/local/apache2/logs/legacy-php54_error.log
    CustomLog /usr/local/apache2/logs/legacy-php54_access.log combined
</VirtualHost>
