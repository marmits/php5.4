<VirtualHost *:80>
    ServerName projet154
    DocumentRoot /var/www/projet1

    <Directory /var/www/projet1>
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPassMatch "^/(.*\.php(/.*)?)$" "fcgi://php54-fpm:9000/var/www/projet1/"
    DirectoryIndex index.php index.html

    ErrorLog /usr/local/apache2/logs/projet1_error.log
    CustomLog /usr/local/apache2/logs/projet1_access.log combined
</VirtualHost>
